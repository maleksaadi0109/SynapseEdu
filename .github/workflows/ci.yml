name: EduBridge API CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  laravel-tests:
    name: Build, Lint & Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.4']

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: edubridge_test
          POSTGRES_USER: edubridge
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom, fileinfo, curl, pdo, pdo_pgsql, pgsql, redis
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment File
        run: |
          cp .env.example .env.testing
          echo "DB_CONNECTION=pgsql" >> .env.testing
          echo "DB_HOST=127.0.0.1" >> .env.testing
          echo "DB_PORT=5432" >> .env.testing
          echo "DB_DATABASE=edubridge_test" >> .env.testing
          echo "DB_USERNAME=edubridge" >> .env.testing
          echo "DB_PASSWORD=secret" >> .env.testing
          echo "REDIS_HOST=127.0.0.1" >> .env.testing

      - name: Generate Application Key
        run: php artisan key:generate --env=testing

      - name: Check Code Formatting (Pint)
        run: vendor/bin/pint --test

      - name: Execute Database Migrations
        run: php artisan migrate:fresh --env=testing --force

      - name: Run Test Suite
        run: php artisan test --env=testing
